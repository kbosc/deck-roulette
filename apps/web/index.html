<!doctype html>
<!-- lang is what tells a screen reader which voice to read the page with. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Deck Roulette</title>
    <!--
      Blocking on purpose: it sets the chosen theme before the first paint. Loaded with the
      app, the page would flash the system theme first. Mirrors src/theme/theme.ts.
    -->
    <script>
      try {
        const theme = localStorage.getItem("deck-roulette:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
