name: CI

# Runs on every push to main and on every pull request. A check that only runs
# on main tells you about a problem once it is already merged.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in flight: only the latest
# commit is worth an opinion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Reads packageManager from package.json, so the version used here is the
      # one declared in the repo — never a different one.
      - uses: pnpm/action-setup@v4

      # Pinned rather than read from engines.node: that field is a floor
      # (">=22"), and CI must run on one known version, not on whatever is
      # latest the day it runs.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails instead of updating the lockfile: a dependency
      # added without committing the lockfile must not slip through.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # The stylesheet is generated, never committed. Building it here proves
      # the generator still runs against the JSON as it stands.
      - run: pnpm build
